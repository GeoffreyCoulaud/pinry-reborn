<title>Blind PR Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2320; --muted:#5f6b65; --line:#d9dfdb;
  --accent:#2f6f5e; --accent-ink:#ffffff; --code:#eef1ee; --pick:#e3efe9;
  --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --display:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --panel:#1b201d; --ink:#e4e9e6; --muted:#9aa7a0; --line:#2e3632;
    --accent:#7cc2ab; --accent-ink:#0f1412; --code:#232a26; --pick:#223029; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1b201d; --ink:#e4e9e6; --muted:#9aa7a0; --line:#2e3632;
  --accent:#7cc2ab; --accent-ink:#0f1412; --code:#232a26; --pick:#223029; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:1840px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font:600 clamp(26px,4vw,36px)/1.15 var(--display);margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:500 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs button:focus-visible,select:focus-visible,textarea:focus-visible,.save:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pr-head{display:flex;flex-direction:column;gap:4px}
.pr-head h2{margin:0;font:600 20px var(--display)}
.pr-head p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,820px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.card.ranked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--pick);border-radius:8px 8px 0 0}
.tag{font:500 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.card header label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select{font:500 14px var(--body);padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.md{padding:14px 18px;overflow-wrap:anywhere;min-width:0}
.md h1,.md h2,.md h3{font-family:var(--body);font-weight:600;line-height:1.3;margin:1.1em 0 .4em}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15px}
.md .title{font:600 17px/1.35 var(--body);margin:0 0 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.md p,.md ul,.md ol{margin:.5em 0}
.md code{font:13px var(--mono);background:var(--code);padding:1px 4px;border-radius:4px}
.md pre{background:var(--code);padding:10px 12px;border-radius:6px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-top:12px}
.md summary{cursor:pointer;color:var(--muted)}
.md .mermaid{background:var(--panel);overflow-x:auto;text-align:center}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{font:14px/1.5 var(--body);min-height:70px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.save{font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
.save:disabled{opacity:.5;cursor:default}
.status{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap">
  <h1>Blind PR reading</h1>
  <p class="lede" id="lede"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="panel" aria-live="polite"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const DATA = /*DATA*/;
const RANKS = {};
let current = DATA.prs[0].pr;
let db = null;

function dark(){
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
try { mermaid.initialize({ startOnLoad:false, theme: dark() ? "dark" : "neutral", securityLevel:"strict" }); } catch (e) {}

function renderMarkdown(text){
  const [title, ...rest] = text.split("\n");
  const html = marked.parse(rest.join("\n"), { gfm:true });
  const div = document.createElement("div");
  div.className = "md";
  const h = document.createElement("p");
  h.className = "title";
  h.textContent = title.replace(/^#\s*/, "");
  div.appendChild(h);
  const body = document.createElement("div");
  body.innerHTML = html;
  body.querySelectorAll("pre > code.language-mermaid").forEach(code => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
  div.appendChild(body);
  return div;
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...DATA.prs.map(p => {
    const b = document.createElement("button");
    b.role = "tab";
    b.textContent = p.label;
    b.setAttribute("aria-selected", String(p.pr === current));
    b.onclick = () => { current = p.pr; renderTabs(); renderPanel(); };
    return b;
  }));
}

function renderPanel(){
  const p = DATA.prs.find(x => x.pr === current);
  const state = RANKS[p.pr] || { ranks:{}, note:"" };
  const panel = document.getElementById("panel");
  const head = document.createElement("div");
  head.className = "pr-head";
  head.innerHTML = "<h2></h2><p></p>";
  head.querySelector("h2").textContent = p.label;
  head.querySelector("p").textContent = p.about;
  const cards = document.createElement("div");
  cards.className = "cards";
  p.items.forEach(item => {
    const card = document.createElement("article");
    card.className = "card" + (state.ranks[item.id] ? " ranked" : "");
    const header = document.createElement("header");
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "Description " + item.id.slice(1);
    const label = document.createElement("label");
    label.textContent = "Rank";
    const sel = document.createElement("select");
    sel.id = "rank-" + item.id;
    sel.append(new Option("·", ""), ...p.items.map((_, i) => new Option(String(i + 1), String(i + 1))));
    sel.value = state.ranks[item.id] ? String(state.ranks[item.id]) : "";
    sel.onchange = () => {
      const s = RANKS[p.pr] || (RANKS[p.pr] = { ranks:{}, note:"" });
      if (sel.value) s.ranks[item.id] = Number(sel.value); else delete s.ranks[item.id];
      s.saved = false;
      card.classList.toggle("ranked", !!sel.value);
      updateBar();
    };
    label.appendChild(sel);
    header.append(tag, label);
    card.append(header, renderMarkdown(item.text));
    cards.appendChild(card);
  });
  const note = document.createElement("div");
  note.className = "note";
  note.innerHTML = '<label for="note">Note on this pull request (optional)</label><textarea id="note"></textarea>';
  const ta = note.querySelector("textarea");
  ta.value = state.note || "";
  ta.oninput = () => { const s = RANKS[p.pr] || (RANKS[p.pr] = { ranks:{}, note:"" }); s.note = ta.value; s.saved = false; updateBar(); };
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = '<button class="save" id="save">Save the ranking</button><span class="status" id="status"></span>';
  panel.replaceChildren(head, cards, note, bar);
  document.getElementById("save").onclick = save;
  updateBar();
  try { mermaid.run({ querySelector: "#panel pre.mermaid" }); } catch (e) {}
}

function updateBar(){
  const p = DATA.prs.find(x => x.pr === current);
  const s = RANKS[p.pr] || { ranks:{} };
  const values = Object.values(s.ranks);
  const complete = values.length === p.items.length && new Set(values).size === values.length;
  const btn = document.getElementById("save");
  const status = document.getElementById("status");
  if (!btn) return;
  btn.disabled = !complete || !db;
  status.textContent = !db ? "Saving is not available in this view."
    : complete ? (s.saved ? "Saved." : "Ready to save.")
    : "Give each description a different rank from 1 to " + p.items.length + ".";
}

async function save(){
  const p = DATA.prs.find(x => x.pr === current);
  const s = RANKS[p.pr];
  const status = document.getElementById("status");
  try {
    await db.doc(DATA.collection + "/pr-" + p.pr).set({ ranks: s.ranks, note: s.note || "", savedAt: new Date().toISOString() });
    s.saved = true;
    status.textContent = "Saved.";
  } catch (e) {
    status.textContent = "Not saved (" + (e && e.code || "error") + "). Try again in a moment.";
  }
}

document.getElementById("lede").textContent = DATA.lede;
renderTabs();
renderPanel();

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { updateBar(); return; }
  for (const p of DATA.prs) {
    try {
      const snap = await db.doc(DATA.collection + "/pr-" + p.pr).get();
      if (snap.exists) { const d = snap.data(); RANKS[p.pr] = { ranks: { ...d.ranks }, note: d.note || "", saved: true }; }
    } catch (e) {}
  }
  renderPanel();
})();
</script>
