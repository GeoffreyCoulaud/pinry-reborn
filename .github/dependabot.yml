version: 2
updates:
  # Gradle dependencies (libs.versions.toml + build scripts): one grouped
  # weekly PR covering every update.
  - package-ecosystem: "gradle"
    directory: "/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle:
        patterns:
          - "*"

  # GitHub Actions pinned to commit SHAs: one grouped weekly PR. Stays at "/" because
  # .github/workflows/ does; only the Gradle build and the Dockerfile moved under api/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # The pnpm workspace of clients/: one grouped weekly PR. Dependabot's "npm" ecosystem is
  # what reads pnpm-lock.yaml; the directory is the workspace root, not each package.
  - package-ecosystem: "npm"
    directory: "/clients"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      clients:
        patterns:
          - "*"

  # yt-dlp's pins: requirements.in beside it makes Dependabot recompile requirements.txt with pip-compile,
  # hashes included (ADR 0048, decision 4).
  - package-ecosystem: "pip"
    directory: "/api/tools/yt-dlp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      yt-dlp:
        patterns:
          - "*"

  # Base images of `api/Dockerfile`, the runtime and deno, pinned by tag and digest: one grouped weekly PR.
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"

  # The web application and the pipeline's environments (any file whose name holds "dockerfile"):
  # grouped by name across both, so one pull request moves the two Node digests together.
  - package-ecosystem: "docker"
    directories:
      - "/.dagger"
      - "/clients/apps/webapp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      webapp-and-pipeline-docker:
        group-by: dependency-name

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-compose:
        patterns:
          - "*"
