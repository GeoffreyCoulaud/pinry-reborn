version: 2
updates:
  # Gradle dependencies (libs.versions.toml + build scripts): one grouped
  # weekly PR covering every update.
  - package-ecosystem: "gradle"
    directory: "/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle:
        patterns:
          - "*"

  # GitHub Actions pinned to commit SHAs: one grouped weekly PR. Stays at "/" because
  # .github/workflows/ does; only the Gradle build and the Dockerfile moved under api/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # The pnpm workspace of clients/: one grouped weekly PR. Dependabot's "npm" ecosystem is
  # what reads pnpm-lock.yaml; the directory is the workspace root, not each package.
  - package-ecosystem: "npm"
    directory: "/clients"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      clients:
        patterns:
          - "*"

  # Base images, pinned by tag and digest: one grouped weekly PR per file that names them.
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/clients/apps/webapp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      webapp-docker:
        patterns:
          - "*"

  # The pipeline's environments: Dependabot reads any file whose name holds "dockerfile".
  - package-ecosystem: "docker"
    directory: "/.dagger"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      pipeline-docker:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-compose:
        patterns:
          - "*"
