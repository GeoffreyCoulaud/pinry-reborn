name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# Serialised, not cancelled: two close pushes to main would otherwise delete each other's engine
# state entry, and cancelling the first would drop a release halfway through its attestations.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job name must stay "validate": branch protection requires the "validate / gate" check.
  validate:
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/validate.yml
    with:
      push: true
