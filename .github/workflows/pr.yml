name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name must stay "validate": branch protection requires the "validate / gate" check. A pull
  # request runs verify alone, and verify reads.
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      push: false
