name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name must stay "validate": branch protection requires the "validate / gate" check. The
  # caller's grant is a ceiling checked when the run starts, over every job the called workflow
  # declares and not only the ones that run, so a scope publish or engine-state asks for has to be granted
  # here even though a pull request starts neither. What the build's token actually carries is the
  # permissions block on verify, which is contents: read.
  validate:
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/validate.yml
    with:
      push: false
