name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name must stay "validate": branch protection requires the "validate / gate" check. The
  # permissions are unused here and granted because a caller must match what verify declares.
  validate:
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/validate.yml
    with:
      push: false
