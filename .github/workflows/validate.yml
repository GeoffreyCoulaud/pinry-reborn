name: Validate

on:
  workflow_call:
    inputs:
      push:
        description: "Publish the container image to GHCR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The JDK, libvips and python3 are the Dagger function's container, not the runner's: nothing is
  # installed here beyond the CLI.
  #
  # One job, because a second runner rebuilds the fast jar the first already built
  # (docs/adr/0031-the-gate-builds-once-and-keeps-its-cache.md, decision 1).
  verify:
    runs-on: ubuntu-latest
    # Not the six-hour default: a dying Gradle task has twice left a build running and never reporting.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # Keyless cosign signing, on the release path only.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The contract guard and the step below both read origin/main, which a shallow fetch lacks.
          fetch-depth: 0
      - name: Whether every changed path is a markdown file
        id: scope
        # docs/adr/0030-the-gate-is-paid-where-it-can-fail.md, decisions 1 to 4. github.base_ref is
        # empty outside a pull request, which is what keeps the release path off the shortcut.
        run: |
          base='${{ github.base_ref }}'
          docs_only=false
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "origin/$base...HEAD")
            echo "Changed paths:"
            echo "$changed"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '\.md$'; then
              docs_only=true
            fi
          fi
          echo "Documentation only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        # The action only installs the CLI; the version pairs with dagger.json's engineVersion.
        with:
          version: "0.21.9"
      # The gate, then the image built and smoked from the fast jar the gate itself produced. A
      # pull request builds one architecture; buildx below builds both on the release path, so a
      # release still ships both and a defect showing on arm64 alone surfaces there.
      #
      # Without --progress=plain the renderer redraws in place, a runner's log keeps only what was
      # printed, and the job reads exactly like a hang.
      - name: Gate, image and smoke
        if: ${{ steps.scope.outputs.docs-only != 'true' }}
        run: dagger call --progress=plain ci
      - name: Prose
        if: ${{ steps.scope.outputs.docs-only == 'true' }}
        run: dagger call --progress=plain prose

      # Exported rather than rebuilt: quarkus-app is the gate's own build, so this is a cache hit
      # on the engine ci just used and the pushed image carries the bytes smoke started.
      - name: Export the Quarkus fast jar
        if: ${{ inputs.push }}
        run: dagger call quarkus-app export --path=api/api-application/build/quarkus-app
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: ${{ inputs.push }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: ${{ inputs.push }}
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        if: ${{ inputs.push }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/geoffreycoulaud/pinry-reborn-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern=v{{version}}
      # A second build of the same Dockerfile and the same exported jar: cosign signs the pushed
      # digest, which cannot be the one smoke started while the registry stays out of the pipeline
      # (docs/adr/0024-three-projects-share-one-repository.md, decision 5).
      - name: Build and push image
        if: ${{ inputs.push }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute lowercase image ref
        if: ${{ inputs.push }}
        id: image
        # github.repository keeps the owner's case (GeoffreyCoulaud) and an OCI reference must be
        # lowercase.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CycloneDX SBOM (standard, for external consumers)
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: cyclonedx-json
          output-file: /tmp/sbom.cyclonedx.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Syft-JSON SBOM (native, for the VEX-aware daily scan)
        # Not a duplicate of the one above: Syft's own format keeps the image identity that
        # image-scoped OpenVEX statements resolve against, which CycloneDX drops.
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: syft-json
          output-file: /tmp/sbom.syft.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOMs and VEX (keyless OIDC via cosign)
        if: ${{ inputs.push }}
        run: |
          ref='${{ steps.image.outputs.ref }}'
          cosign attest --yes --type cyclonedx \
            --predicate /tmp/sbom.cyclonedx.json "$ref"
          cosign attest --yes --type https://syft.dev/bom \
            --predicate /tmp/sbom.syft.json "$ref"
          cosign attest --yes --type openvex \
            --predicate security/vex.openvex.json "$ref"

  # Branch protection reads a skipped job as passing, so this single required check always runs and
  # fails explicitly. It accepts "skipped" too (docs/adr/0030-the-gate-is-paid-where-it-can-fail.md,
  # decision 2), which lets no failure through: verify has no condition of its own to be skipped by.
  gate:
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Needed job results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not succeed (results: $results)"
              exit 1
            fi
          done
