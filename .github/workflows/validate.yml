name: Validate

on:
  workflow_call:
    inputs:
      push:
        description: "Publish the container image to GHCR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Read-only: this is the job that runs the build's third-party plugins, and nothing it does needs
  # a write scope (docs/adr/0031-the-gate-builds-once-and-keeps-its-cache.md, decision 1).
  verify:
    runs-on: ubuntu-latest
    # Not the six-hour default: a dying Gradle task has twice left a build running and never reporting.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      STATE_DIR: /mnt/dagger/state
      ARCHIVE: /mnt/dagger/state.tar.zst
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The contract guard and the step below both read origin/main, which a shallow fetch lacks.
          fetch-depth: 0
      - name: Read the engine version dagger.json pins
        # One source: the command line, the image and the cache key cannot drift apart.
        run: echo "ENGINE_VERSION=$(jq -r '.engineVersion | ltrimstr("v")' dagger.json)" >> "$GITHUB_ENV"
      - name: Whether every changed path is a markdown file
        id: scope
        # github.base_ref is empty outside a pull request, which keeps the release path off the
        # shortcut (docs/adr/0030-the-gate-is-paid-where-it-can-fail.md, decisions 1 to 4).
        run: |
          base='${{ github.base_ref }}'
          docs_only=false
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "origin/$base...HEAD")
            echo "Changed paths:"
            echo "$changed"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '\.md$'; then
              docs_only=true
            fi
          fi
          echo "Documentation only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.ENGINE_VERSION }}

      # The runner's own engine dies with the runner, so the job starts one it can archive
      # (docs/adr/0031-the-gate-builds-once-and-keeps-its-cache.md, decisions 2 to 5).
      - name: Prepare the engine state directory
        run: |
          sudo mkdir -p "$STATE_DIR"
          sudo chown "$(id -u):$(id -g)" "$(dirname "$STATE_DIR")"
      # The key rolls because GitHub's entries are immutable: a fixed one would freeze the cache on
      # the first merge that saved it. A documentation-only run calls prose alone and has nothing to
      # gain from three gigabytes of state.
      - name: Restore the engine state
        if: ${{ steps.scope.outputs.docs-only != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ARCHIVE }}
          key: dagger-state-v${{ env.ENGINE_VERSION }}-${{ github.sha }}
          restore-keys: dagger-state-v${{ env.ENGINE_VERSION }}-
      - name: Unpack the engine state
        if: ${{ steps.scope.outputs.docs-only != 'true' }}
        run: |
          if [ ! -f "$ARCHIVE" ]; then
            echo "No archive restored: this run starts from nothing."
            exit 0
          fi
          # A corrupt entry costs a slow run, never a red one.
          if ! sudo tar --zstd -xf "$ARCHIVE" -C "$STATE_DIR"; then
            echo "::warning::the restored state does not unpack; starting from nothing"
            sudo rm -rf "$STATE_DIR"
            sudo mkdir -p "$STATE_DIR"
          fi
          sudo du -sh "$STATE_DIR"
      - name: Start the engine on that state
        # Same rule as unpacking: an engine that will not come up on a restored state comes up
        # without it rather than failing the run.
        run: |
          for attempt in restored empty; do
            if [ "$attempt" = empty ]; then
              echo "::warning::the engine never answered on the restored state; starting from nothing"
              docker logs dagger-engine
              docker rm --force dagger-engine
              sudo rm -rf "$STATE_DIR"
              sudo mkdir -p "$STATE_DIR"
            fi
            docker run --detach --privileged \
              --name dagger-engine \
              --volume "$STATE_DIR":/var/lib/dagger \
              --volume "$PWD/.github/engine.json":/etc/dagger/engine.json \
              "registry.dagger.io/engine:v$ENGINE_VERSION"
            for _ in $(seq 1 60); do
              if dagger core version; then exit 0; fi
              sleep 2
            done
          done
          echo "::error::the engine never answered"
          docker logs dagger-engine
          exit 1
      # Without --progress=plain the renderer redraws in place, a runner's log keeps only what was
      # printed, and the job reads exactly like a hang.
      - name: Gate, image and smoke
        if: ${{ steps.scope.outputs.docs-only != 'true' }}
        run: dagger call --progress=plain ci
      - name: Prose
        if: ${{ steps.scope.outputs.docs-only == 'true' }}
        run: dagger call --progress=plain prose

      # A cache hit and not a second build: quarkus-app returns the gate's own, so the image the
      # publish job pushes carries the bytes smoke started.
      - name: Export the Quarkus fast jar
        if: ${{ inputs.push }}
        run: dagger call quarkus-app export --path=api/api-application/build/quarkus-app
      - name: Hand the fast jar to the publish job
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarkus-app
          path: api/api-application/build/quarkus-app
          retention-days: 1

      # Best effort, and last: the cache is an optimisation, and a failed archive or upload must not
      # cost a green gate its image and its attestations.
      # Stopped before it is read: a state captured from a running engine is not assumed restorable.
      - name: Stop the engine and archive its state
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          docker stop -t 180 dagger-engine
          # docker stop exits 0 after a SIGKILL too, and 137 is the live-engine state decision 3 refuses.
          if [ "$(docker inspect -f '{{.State.ExitCode}}' dagger-engine)" = 137 ]; then
            echo "::error::the engine was killed rather than stopped; its state is not archived"
            exit 1
          fi
          sudo du -sh "$STATE_DIR"
          sudo tar --zstd -cf "$ARCHIVE" -C "$STATE_DIR" .
          sudo chown "$(id -u):$(id -g)" "$ARCHIVE"
          ls -l "$ARCHIVE"
      - name: Save the engine state
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ARCHIVE }}
          key: dagger-state-v${{ env.ENGINE_VERSION }}-${{ github.sha }}

  # One entry is a condition and not tidiness: at three gigabytes against the four the quota leaves
  # free, a second would evict the release path's buildx cache. Its own job, so that the scope to
  # delete a cache entry stays off the job that runs the build.
  prune:
    needs: [verify]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete the engine state entries this run replaces
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Listed on the whole prefix and not on the version: an engine bump would otherwise leave
          # the previous version's entry behind until GitHub evicts it.
          keep="dagger-state-v$(jq -r '.engineVersion | ltrimstr("v")' dagger.json)-${{ github.sha }}"
          gh cache list --key dagger-state- --limit 100 --json id,key \
            | jq -r --arg keep "$keep" '.[] | select(.key != $keep) | .id' \
            | xargs -r -n1 gh cache delete

  # The registry, the identity and the signing live here alone, on the release path alone. It
  # rebuilds nothing: the fast jar is the one verify's gate produced and smoked.
  publish:
    needs: [verify]
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Keyless cosign signing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quarkus-app
          path: api/api-application/build/quarkus-app

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/geoffreycoulaud/pinry-reborn-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern=v{{version}}
      # A second build of the same Dockerfile and the same jar: cosign signs the pushed digest,
      # which the pipeline cannot produce while the registry stays out of it
      # (docs/adr/0024-three-projects-share-one-repository.md, decision 5).
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute lowercase image ref
        id: image
        # github.repository keeps the owner's case and an OCI reference must be lowercase.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CycloneDX SBOM (standard, for external consumers)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.ref }}
          format: cyclonedx-json
          output-file: /tmp/sbom.cyclonedx.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Syft-JSON SBOM (native, for the VEX-aware daily scan)
        # Not a duplicate: Syft's format keeps the image identity OpenVEX resolves against, which
        # CycloneDX drops.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.ref }}
          format: syft-json
          output-file: /tmp/sbom.syft.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOMs and VEX (keyless OIDC via cosign)
        run: |
          ref='${{ steps.image.outputs.ref }}'
          cosign attest --yes --type cyclonedx \
            --predicate /tmp/sbom.cyclonedx.json "$ref"
          cosign attest --yes --type https://syft.dev/bom \
            --predicate /tmp/sbom.syft.json "$ref"
          cosign attest --yes --type openvex \
            --predicate security/vex.openvex.json "$ref"

  # Branch protection reads a skipped job as passing, so the one required check always runs and
  # fails explicitly (docs/adr/0030-the-gate-is-paid-where-it-can-fail.md, decision 2).
  gate:
    needs: [verify, prune, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Needed job results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not succeed (results: $results)"
              exit 1
            fi
          done
