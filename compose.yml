# `(cd api && ./gradlew :api-application:quarkusBuild)` is a prerequisite: the API's image copies a
# fast jar Gradle produced before `docker build` ran.

# Named rather than taken from the checkout directory, which the rename to `pinry-reborn` changed:
# two clones would otherwise be two projects on two `data` volumes.
name: pinry-reborn

services:
  # One API process is assumed and nothing enforces it: the task queue's claim and each check-then-insert
  # pair need it (ADR 0059, decision 2).
  api:
    build: ./api
    environment:
      MEDIA_DATA_DIR: /data/media
      EXPORTS_DATA_DIR: /data/exports
      IMPORTS_DATA_DIR: /data/imports
      DB_URL: jdbc:postgresql://postgres:5432/pinry
      DB_USERNAME: pinry
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, the database's password}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # An image bump that changes ICU's version needs the collated indexes rebuilt (api/AGENTS.md, Gotchas).
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: pinry
      POSTGRES_USER: pinry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, the database's password}
      # No index depends on the C library's collation tables (ADR 0059, decision 6).
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    volumes:
      # The image's volume from 18 on, which holds a directory per major.
      - database:/var/lib/postgresql
    healthcheck:
      # Over TCP: on a first boot the image's temporary server answers on the socket alone.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=pinry", "--dbname=pinry"]
      interval: 2s
      timeout: 5s
      retries: 30

  webapp:
    build:
      context: .
      dockerfile: clients/apps/webapp/Dockerfile

  proxy:
    image: nginx:1-alpine-slim@sha256:f761b94f2cb9e8e05e2943d5f773609596113ef69b54e2433a996d109a8f78b7
    ports:
      - "6258:6258"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    # Load bearing: nginx resolves a literal `proxy_pass` upstream once, at startup, and exits with
    # `host not found in upstream` when the name is not up yet.
    depends_on:
      api:
        condition: service_healthy
      webapp:
        condition: service_started

volumes:
  data:
  database:
