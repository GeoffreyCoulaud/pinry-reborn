# The image carries static files and no topology: no /api route lives here, so an operator
# who already runs a proxy puts this behind theirs (docs/specs/2026-09-10-web-application.md,
# decision B). The path below is where the image's own default configuration sits.
server {
    listen 80;
    root /srv;

    location / {
        # The application's routes exist in the browser alone, so anything that is not a file
        # on disk is answered with the document that boots the router.
        try_files $uri /index.html;
    }
}
