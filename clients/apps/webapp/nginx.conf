server {
    listen 80;
    root /srv;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri /index.html;
    }

    # Vite hashes every asset this document names, so a heuristically cached copy of it can outlive
    # them across an upgrade and leave a blank page nobody can reproduce.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
