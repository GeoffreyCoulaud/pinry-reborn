# The JavaScript ecosystem's root (docs/adr/0024-three-projects-share-one-repository.md, decision 1).
packages:
  - apps/*
  - packages/*
# MSW's install script only refreshes the service worker a browser would run, and question Z
# keeps every browser out of the gate: `msw/node` is all this workspace loads.
allowBuilds:
  msw: false
# 1440 is also pnpm's default, and declaring it is what makes it refuse: undeclared, pnpm installs
# the fresh version anyway and writes the waiver below. Measured on 12.3.4 against a two-hour-old
# eslint on 2026-09-19.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Every line here is one version that entered inside its window. Read a new one as a finding.
minimumReleaseAgeExclude:
  - '@tanstack/history@1.162.3'
  - '@tanstack/react-router@1.170.34'
  - '@tanstack/router-core@1.171.29'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - vite@8.3.0
