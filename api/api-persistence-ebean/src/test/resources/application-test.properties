# Test datasource override for the repository test suite (RepositoryTest-derived classes,
# which use `DB.getDefault()`).
#
# Naming matters: avaje-config (which Ebean's implicit `DB.getDefault()` bootstrap uses) only
# looks for a test overlay named `application-test.properties`/`.yaml` (or the deprecated
# `test-ebean.properties`) -- see io.avaje.config.InitialLoader#loadTest().
#
# ebean-test points the datasource at this suite's own database: in a container it starts on a
# workstation, at the host the gate names otherwise (ADR 0059, decision 3). One connection, as
# production holds.
datasource.db.minConnections=1
datasource.db.maxConnections=1

ebean.migration.run=true
ebean.migration.path=dbmigration
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.ebean.models
ebean.test.platform=postgres
ebean.test.ddlMode=migrations
ebean.test.dbName=pinry_persistence
ebean.test.postgres.version=18.6
ebean.test.postgres.containerName=pinry_reborn_postgres
ebean.test.useDocker=${TEST_POSTGRES_USE_DOCKER:true}
ebean.test.host=${TEST_POSTGRES_PERSISTENCE_HOST:localhost}
