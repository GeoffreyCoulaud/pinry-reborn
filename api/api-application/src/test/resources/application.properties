ebean.test.platform=sqlite
ebean.test.ddlMode=none
ebean.test.dbName=test

# Not an avaje-config overlay, unlike api-persistence-sqlite's application-test.properties: this one
# shares the production file's name and wins by classpath order, per property and not per file, so a
# key absent here is read from the production file.
# One connection: :memory: gives each connection its own database, so a second one sees no tables.
datasource.db.url=jdbc:sqlite::memory:
datasource.db.driver=org.sqlite.JDBC
datasource.db.username=sa
datasource.db.password=
datasource.db.minConnections=1
datasource.db.maxConnections=1

ebean.migration.run=true
ebean.migration.path=dbmigration
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.sqlite.models

# Test mode indexes src/test too, so a test run would write TestFailuresResource into contract/openapi.json;
# the gate produces that file from the production build alone and refuses a committed one that differs.
quarkus.smallrye-openapi.store-schema-directory=

# CORS: pin a deterministic single allowed origin so CorsIntegrationTest is decoupled
# from the dev default in the main application.properties.
api.cors.origins=https://app.test

# AuthConfig override: disable the password-change minimum interval so MePasswordIntegrationTest
# success paths stay green (the seed hash is fresh at signup).
auth.password_change_minimum_interval=PT0S

# Fast poll so TaskQueueBootIntegrationTest's bounded wait is quick. The other tasks.* keys kept
# their own defaults, so they are not restated here.
tasks.poll_interval=PT0.05S

# ImportDataDirectoryCheck probes this at startup and refuses the boot when it cannot write, so the
# production default (/var/lib/pinry/imports) would fail every @QuarkusTest in this module, profile
# or no profile. The classes that read or write real archives override it with a per-run directory.
imports.data_dir=build/test-import-data/shared

# ExportDataDirectoryCheck resolves tmp/ and exports/ under this at startup and refuses the boot when
# they answer different file stores, so the production default (/var/lib/pinry/exports) would fail
# every @QuarkusTest in this module. The export classes override it with a per-run directory.
exports.data_dir=build/test-export-data/shared