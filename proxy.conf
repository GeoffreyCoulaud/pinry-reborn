server {
    listen 6258;

    # $http_host and not $host, which drops the port: the API would compute its own origin as
    # http://localhost and answer 403 to the browser's http://localhost:6258.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Mirrors quarkus.http.limits.max-body-size; the default of 1m would answer 413 to most uploads.
    client_max_body_size 32M;

    location /api/ {
        # No URI on proxy_pass: a trailing slash would turn /api/v1/pins into /v1/pins.
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://webapp:80;
    }
}
