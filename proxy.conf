# The frontal proxy: one public origin for the bundle and the API, which is what the session
# cookie needs (docs/adr/0026-one-session-two-transports.md). The port is the same number
# inside the container and on the host, so nothing has to be translated between the two files.
server {
    listen 6258;

    # nginx sets none of these itself, and Host defaults to the upstream's own name.
    # $http_host and not $host: $host drops the port, which leaves the API computing its own
    # origin as http://localhost and answering 403 to the browser's http://localhost:6258.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Mirrors quarkus.http.limits.max-body-size, the API's own backstop above
    # images.max_file_bytes. The default of 1m would answer 413 to most uploads.
    client_max_body_size 32M;

    location /api/ {
        # No URI on proxy_pass, so the request URI is passed unchanged. A trailing slash would
        # replace the matched prefix and turn /api/v1/pins into /v1/pins.
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://webapp:80;
    }
}
