server {
    listen 6258;

    # $http_host and not $host, which drops the port: the API would compute its own origin as
    # http://localhost and answer 403 to the browser's http://localhost:6258.
    proxy_set_header Host $http_host;

    # Deliberately above quarkus.http.limits.max-body-size, so an oversized upload is refused by the
    # use case in application/problem+json rather than by this nginx in HTML.
    client_max_body_size 96M;

    location /api/ {
        # No URI on proxy_pass: a trailing slash would turn /api/v1/pins into /v1/pins.
        proxy_pass http://api:8080;
        # A cold grid's first page waits for its renditions: 40 tiles of 8 s behind 2 permits (ADR 0050).
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://webapp:80;
    }
}
